name: CI

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Check app structure
      run: |
        ls -la app/
        echo "Checking Python files..."
        test -f app/app.py && echo "app.py exists"
        test -f app/models.py && echo "models.py exists"
        test -d app/templates && echo "templates exists"

    - name: Test imports
      run: |
        cd app
        python -c "
        try:
            from app import app
            print('SUCCESS: Flask app imports OK')
        except Exception as e:
            print(f'ERROR: {e}')
            exit(1)
        "

    - name: Build Docker
      run: docker build -t media-app .